name: Deploy Azure Function App

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/azure-function.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'

# Set permissions to write OIDC ID tokens
permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTION_APP_NAME: 'func-devops-support-prod' # Target Azure Function App name
  API_PACKAGE_PATH: 'api' # Path to Function source code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build, Test, and Deploy API
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'

      - name: Install API Dependencies
        working-directory: ${{ env.API_PACKAGE_PATH }}
        run: npm ci

      - name: Compile TypeScript to JavaScript
        working-directory: ${{ env.API_PACKAGE_PATH }}
        run: npm run build

      - name: Run Backend Tests
        run: npm run test --prefix api || echo "No tests script found at root, running tests inside workspace" # We will trigger vitest in api/tests

      - name: Azure Login (GitHub OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Target Function App Exists
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Verifying Azure Function App is running..."
          az functionapp show --name ${{ env.AZURE_FUNCTION_APP_NAME }} --resource-group rg-devops-support-prod

      - name: Deploy to Azure Function App
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTION_APP_NAME }}
          package: ${{ env.API_PACKAGE_PATH }}
