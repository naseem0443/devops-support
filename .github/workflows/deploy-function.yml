name: Deploy Azure Function

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-devops-support-prod
  AZURE_FUNCTIONAPP_PROJECT_PATH: api
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    name: Build and Deploy Azure Function
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
        run: npm ci

      # --------------------------------------------------
      # 4. Build TypeScript
      # --------------------------------------------------
      - name: Build Function
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
        run: npm run build

      # --------------------------------------------------
      # 5. Verify build output
      # --------------------------------------------------
      - name: Verify Function build
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}
        run: |
          echo "Checking build output..."
          ls -la
          echo "Checking dist directory..."
          find dist -maxdepth 3 -type f -print

      # --------------------------------------------------
      # 6. Azure Login using GitHub OIDC
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 7. Verify Azure authentication
      # --------------------------------------------------
      - name: Verify Azure Login
        run: |
          echo "Azure login successful"
          az account show \
            --query "{Name:name,SubscriptionId:id,TenantId:tenantId}" \
            --output table

      # --------------------------------------------------
      # 8. Verify Function App
      # --------------------------------------------------
      - name: Verify Function App
        run: |
          az functionapp show \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "rg-devops-support-prod" \
            --query "{Name:name,State:state,HostName:defaultHostName}" \
            --output table

      # --------------------------------------------------
      # 9. Deploy Azure Function
      # --------------------------------------------------
      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}