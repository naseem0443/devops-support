name: Deploy Azure Function

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: func-devops-support-prod
  AZURE_FUNCTIONAPP_PROJECT_PATH: api
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: api
        run: npm ci


      # --------------------------------------------------
      # 4. Build TypeScript
      # --------------------------------------------------
      - name: Build Function
        working-directory: api
        run: npm run build


      # --------------------------------------------------
      # 5. Verify Function build output
      # --------------------------------------------------
      - name: Verify Function build
        working-directory: api
        run: |
          echo "Checking build output..."
          find dist -type f -print

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "host.json" ]; then
            echo "ERROR: host.json not found."
            exit 1
          fi

          echo "Function build validation successful."


      # --------------------------------------------------
      # 6. Validate Azure OIDC secrets
      # --------------------------------------------------
      # This does NOT print the secret values.
      # It only verifies that the values are exactly
      # the Azure IDs configured for this deployment.
      # --------------------------------------------------
      - name: Validate Azure OIDC secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |

          echo "Validating Azure OIDC configuration..."

          if [[ "$AZURE_CLIENT_ID" == "8b768a57-8928-4c5b-a954-8dcdb6b4fdb6" ]]; then
            echo "AZURE_CLIENT_ID: CORRECT"
          else
            echo "AZURE_CLIENT_ID: WRONG"
            exit 1
          fi


          if [[ "$AZURE_TENANT_ID" == "8ae50b80-ccbf-45ee-a7c5-5a1a3d8ee1ce" ]]; then
            echo "AZURE_TENANT_ID: CORRECT"
          else
            echo "AZURE_TENANT_ID: WRONG"
            exit 1
          fi


          if [[ "$AZURE_SUBSCRIPTION_ID" == "ccfef92a-b0ec-46d0-b085-dd766525287b" ]]; then
            echo "AZURE_SUBSCRIPTION_ID: CORRECT"
          else
            echo "AZURE_SUBSCRIPTION_ID: WRONG"
            exit 1
          fi


          echo "All Azure OIDC values are correct."


      # --------------------------------------------------
      # 7. Azure Login using GitHub OIDC
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # 8. Verify Azure Login
      # --------------------------------------------------
      - name: Verify Azure Login
        run: |
          echo "Azure login successful."

          az account show \
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" \
            -o table


      # --------------------------------------------------
      # 9. Verify Function App
      # --------------------------------------------------
      - name: Verify Function App
        run: |

          az functionapp show \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "rg-devops-support-prod" \
            --query "{Name:name,State:state,HostName:defaultHostName}" \
            -o table


      # --------------------------------------------------
      # 10. Deploy Azure Function
      # --------------------------------------------------
      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}


      # --------------------------------------------------
      # 11. Deployment completed
      # --------------------------------------------------
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Azure Function deployment completed."
          echo "Function App: ${{ env.AZURE_FUNCTIONAPP_NAME }}"
          echo "Project Path: ${{ env.AZURE_FUNCTIONAPP_PROJECT_PATH }}"
          echo "=========================================="